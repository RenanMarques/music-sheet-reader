services:
  app:
    build: .
    image: music-sheet-reader
    ports:
      - "${PORT:-8000}:8000"
    # Set by ./start.sh to the host user, so files in ./data belong to you.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data:/data
      # Live-edit the frontend without rebuilding (backend changes need a rebuild/restart).
      - ./frontend:/app/frontend:ro
    restart: unless-stopped
